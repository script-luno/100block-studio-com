<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scratch API Viewer</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f9f9f9;
            color: #333;
        }
        .card {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        h2 { margin-top: 0; color: #ffab00; }
        ul { padding-left: 20px; }
        li { margin-bottom: 8px; }
        a { color: #0066cc; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .error { color: #d32f2f; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h2 id="user-title">ユーザー情報を読み込み中...</h2>
        <p id="user-bio"></p>
    </div>

    <div class="card">
        <h3>公開プロジェクト一覧</h3>
        <ul id="project-list">
            <li>読み込み中...</li>
        </ul>
    </div>

    <script>
        async function fetchScratchData() {
            const username = 'weather_sunny';
            const userUrl = `https://api.scratch.mit.edu/users/${username}`;
            const projectsUrl = `https://api.scratch.mit.edu/users/${username}/projects`;

            try {
                // 1. ユーザー情報の取得
                const userRes = await fetch(userUrl);
                if (!userRes.ok) throw new Error(`ユーザー情報の取得に失敗 (HTTP ${userRes.status})`);
                const userData = await userRes.json();

                document.getElementById('user-title').textContent = `${userData.username} のプロフィール`;
                document.getElementById('user-bio').textContent = `国: ${userData.profile.country || '不明'} / 紹介文: ${userData.profile.bio || 'なし'}`;

                // 2. プロジェクト一覧の取得
                const projRes = await fetch(projectsUrl);
                if (!projRes.ok) throw new Error(`プロジェクトの取得に失敗 (HTTP ${projRes.status})`);
                const projData = await projRes.json();

                const listEl = document.getElementById('project-list');
                listEl.innerHTML = '';

                if (projData.length === 0) {
                    listEl.innerHTML = '<li>プロジェクトが見つかりませんでした。</li>';
                    return;
                }

                projData.forEach(project => {
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.href = `https://scratch.mit.edu/projects/${project.id}`;
                    a.target = '_blank';
                    a.textContent = project.title;
                    li.appendChild(a);
                    listEl.appendChild(li);
                });

            } catch (error) {
                console.error(error);
                document.body.innerHTML += `<div class="card error">エラーが発生しました: ${error.message}</div>`;
            }
        }

        fetchScratchData();
    </script>

</body>
</html>
